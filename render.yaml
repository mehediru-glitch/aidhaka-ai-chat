services:
  - type: web
    name: aidhaka-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node api/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_HOST
        value: localhost
      - key: DB_USER
        value: diamonds_aidhaka
      - key: DB_PASS
        value: ${DB_PASS}
      - key: DB_NAME
        value: diamonds_aidhaka
      - key: FRONTEND_URL
        value: https://aidhaka.aiammu.com
